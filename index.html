<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YayoLauncher</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
    <style>
      body {
        background-color: #121212;
        overflow: hidden;
      }

      body:not(.loaded) div#app {
        opacity: 0 !important;
        visibility: hidden;
        transition: opacity 0.4s ease-in-out;
      }

      body.loaded div#app {
        transition: opacity 0.4s ease-in-out;
        opacity: 1;
        visibility: visible;
      }

      div.view:not(.active) {
        display: none;
      }

      div.loading,
      div.maintenance,
      div.update {
        position: fixed;
        top: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
        background-color: #121212;
        transition: opacity 0.4s ease-in-out;
      }

      div.loading {
        opacity: 1;
      }

      div.loading.loaded {
        opacity: 0;
      }

      div.maintenance,
      div.update {
        opacity: 0;
      }

      div.maintenance.loaded,
      div.update.loaded {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="view-loading" class="loading" data-view="loading">
      <div class="loading-card">
        <p class="spinner"><i class="fa-solid fa-circle-notch fa-spin"></i></p>
        <p class="text">불러오는 중...</p>
      </div>
    </div>

    <div id="view-maintenance" class="maintenance" data-view="maintenance">
      <div class="maintenance-card">
        <p class="gears"><i class="fa-solid fa-gears"></i></p>
        <h3>점검 중</h3>
        <p class="dates" id="maintenance-dates"></p>
        <p class="text" id="maintenance-reason"></p>
      </div>
    </div>

    <div id="view-update" class="update" data-view="update">
      <div class="maintenance-card">
        <p class="up"><i class="fa-solid fa-circle-up"></i></p>
        <h3>새 업데이트가 있습니다</h3>
        <p class="text" id="update-text">런처를 업데이트하는 중입니다. 잠시만 기다려 주세요...</p>
        <div class="progress-container" id="update-progress-container">
          <div class="progress-info">
            <span id="update-progress-label">다운로드 중...</span>
            <span id="update-progress-percent">0%</span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="update-progress-bar"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="app">
      <div class="app-background"></div>

      <div id="view-login" class="view" data-view="login">
        <div class="login-card">
          <img src="/src/static/images/logo.png" class="logo" alt="로고" />
          <h1>환영합니다</h1>
          <p class="subtitle">계정을 확인하려면 로그인해 주세요.</p>

          <button id="btn-login-ms" class="btn btn-microsoft">
            <i class="fa-brands fa-microsoft"></i>
            <span>Microsoft로 로그인</span>
          </button>

          <div class="login-footer">
            <small>계정이 없으신가요? <a href="https://microsoft.com">여기에서 만들기</a></small>
          </div>
        </div>
      </div>

      <div id="view-home" class="view" data-view="home">
        <aside class="home-sidebar">
          <div class="sidebar-top">
            <div class="user-profile">
              <img src="" id="user-avatar" alt="스킨" />
              <div class="user-details">
                <span id="user-name">Undefined</span>
              </div>
            </div>

            <button id="btn-settings" class="btn btn-secondary" title="설정"><i class="fa-fw fa-solid fa-gear"></i></button>
          </div>

          <div class="sidebar-bottom">
            <div class="profile-selector-container" id="profile-selector">
              <div class="selected-profile">
                <span id="current-profile-name">프로필 선택</span>
                <i class="fa-solid fa-chevron-down"></i>
              </div>
              <div class="profile-dropdown" id="profile-dropdown"></div>
            </div>

            <div class="server-status">
              <div class="status-indicator" id="server-status-indicator">
                <div class="status-dot pinging" id="server-status-dot"></div>
                <span class="status-text" id="server-status-text">확인 중...</span>
              </div>
              <div class="player-count" id="player-count"></div>
            </div>

            <div class="launch-area">
              <button id="btn-play">플레이</button>

              <div class="progress-container hidden" id="launch-progress-container">
                <div class="progress-info">
                  <span id="launch-progress-label">다운로드 중...</span>
                  <span id="launch-progress-percent">0%</span>
                </div>
                <div class="progress-bar-bg">
                  <div class="progress-bar-fill" id="launch-progress-bar"></div>
                </div>
              </div>
            </div>
          </div>
        </aside>

        <main class="home-content">
          <div class="news-header">
            <h2>뉴스</h2>
            <div class="social-links">
              <a href="" target="_blank" class="btn btn-icon-only"><i class="fa-brands fa-discord"></i></a>
              <a href="" target="_blank" class="btn btn-icon-only"><i class="fa-brands fa-x-twitter"></i></a>
              <a href="" target="_blank" class="btn btn-icon-only"><i class="fa-solid fa-globe"></i></a>
            </div>
          </div>

          <hr />

          <div class="news-list" id="news-list"></div>
        </main>
      </div>

      <div id="view-settings" class="view overlay" data-view="settings">
        <div class="settings-modal">
          <button id="btn-close-settings" class="btn btn-icon-only btn-close-absolute">
            <i class="fa-fw fa-solid fa-xmark"></i>
          </button>

          <aside class="settings-sidebar">
            <h2>설정</h2>
            <nav>
              <button class="btn nav-btn active" data-tab="game"><i class="fa-fw fa-solid fa-cubes"></i><span>게임</span></button>
              <button class="btn nav-btn" data-tab="skin"><i class="fa-fw fa-solid fa-shirt"></i><span>스킨</span></button>
              <button class="btn nav-btn" data-tab="account"><i class="fa-fw fa-solid fa-user"></i><span>계정</span></button>
            </nav>
            <p id="version"></p>
          </aside>

          <main class="settings-content" id="settings-content">
            <section id="tab-game" class="tab-content active">
              <h3>Minecraft 설정</h3>

              <div class="setting-group">
                <label><i class="fa-fw fa-solid fa-memory"></i>&nbsp;&nbsp;메모리 할당</label>

                <div class="dual-slider-container">
                  <div class="slider-track"></div>
                  <div class="slider-fill" id="ram-track-fill"></div>

                  <input type="range" id="ram-min" min="0.5" max="16" step="0.5" value="2" />
                  <input type="range" id="ram-max" min="0.5" max="16" step="0.5" value="8" />
                </div>

                <div class="ram-labels">
                  <span id="ram-min-label">2 GB</span>
                  <span id="ram-max-label">8 GB</span>
                </div>
              </div>

              <div class="setting-group">
                <label><i class="fa-fw fa-solid fa-display"></i>&nbsp;&nbsp;해상도</label>
                <select id="resolution-select"></select>
              </div>

              <div class="setting-group">
                <label for="launcher-action"><i class="fa-solid fa-power-off"></i>&nbsp;&nbsp;게임 실행 후 동작</label>
                <div class="select-wrapper">
                  <select id="launcher-action-select">
                    <option value="close">런처 닫기</option>
                    <option value="keep">런처 열어 두기</option>
                    <option value="hide">런처 숨기기 (최소화)</option>
                  </select>
                </div>
              </div>

              <div class="setting-group">
                <label><i class="fa-brands fa-java"></i>&nbsp;&nbsp;Java 버전</label>
                <div class="java-selector">
                  <select id="java-select">
                    <option value="bundled">내장 Java 사용 (권장)</option>
                    <option value="system">시스템 Java 사용 (PATH)</option>
                  </select>
                </div>
              </div>
            </section>

            <section class="tab-content skin-management" id="tab-skin">
              <h3>스킨 관리</h3>

              <canvas id="skin-container"></canvas>

              <div class="setting-group">
                <label><i class="fa-fw fa-solid fa-shirt"></i>&nbsp;&nbsp;스킨</label>

                <div id="skin-gallery" class="skin-gallery"></div>
                <div id="add-skin" class="add-skin">
                  <p class="add-skin-title">스킨 추가</p>
                  <div class="btns-add-skin">
                    <button id="btn-add-skin-file" class="btn-add-skin active">파일</button>
                    <button id="btn-add-skin-url" class="btn-add-skin">URL</button>
                  </div>

                  <div id="form-add-skin-file">
                    <label for="input-add-skin-file">스킨 파일:</label>
                    <input type="file" id="input-add-skin-file" accept=".png" />
                    <button class="btn btn-choose-file btn-secondary" id="btn-add-skin-choose-file">파일 선택...</button>
                    <div id="div-add-skin-file-selected" class="selected-file" style="display: none">
                      <span id="span-add-skin-file-name">선택된 파일 없음</span>
                      <button id="btn-selected-file-reset" class="btn btn-secondary btn-reset"><i class="fa-solid fa-times"></i></button>
                    </div>
                  </div>

                  <div id="form-add-skin-url" style="display: none">
                    <label for="input-add-skin-url">스킨 URL:</label>
                    <input type="text" id="input-add-skin-url" placeholder="https://..." />
                  </div>

                  <label for="add-skin-variant-field">모델:</label>
                  <div class="variant-options" id="add-skin-variant-field">
                    <input type="radio" id="input-add-skin-variant-classic" name="variant" value="classic" checked />
                    <label for="input-add-skin-variant-classic">클래식</label>
                    <input type="radio" id="input-add-skin-variant-slim" name="variant" value="slim" />
                    <label for="input-add-skin-variant-slim">슬림</label>
                  </div>
                  <button id="btn-add-skin-submit" class="add-skin-btn-submit btn btn-secondary" disabled>추가 후 적용</button>
                </div>
              </div>

              <div class="setting-group">
                <label><i class="fa-fw fa-solid fa-square"></i>&nbsp;&nbsp;망토</label>

                <div id="cape-gallery" class="skin-gallery"></div>
              </div>
            </section>

            <section id="tab-account" class="tab-content">
              <h3>계정 관리</h3>

              <div class="account-card">
                <div class="account-header">
                  <img src="" alt="스킨" class="account-avatar" id="settings-user-avatar" />
                  <div class="account-details">
                    <span class="account-name" id="settings-user-name"></span>
                    <span class="account-uuid" id="settings-user-uuid">UUID: 550e8400-e29b...</span>
                    <span class="account-type" id="settings-user-type"><i class="fa-brands fa-microsoft"></i>&nbsp;&nbsp;Microsoft 계정</span>
                  </div>
                </div>

                <div class="account-actions">
                  <a href="https://www.xbox.com/play/user" target="_blank" class="btn btn-secondary">
                    <i class="fa-fw fa-solid fa-external-link-alt"></i><span>Xbox 계정 관리</span>
                  </a>
                  <button id="btn-logout" class="btn btn-danger"><i class="fa-fw fa-solid fa-right-from-bracket"></i><span>로그아웃</span></button>
                </div>
              </div>
            </section>
          </main>
        </div>
      </div>
    </div>

    <div id="custom-dialog" class="dialog-overlay hidden">
      <div class="dialog-box">
        <h3 id="dialog-title" class="hidden">알림</h3>
        <p id="dialog-message"></p>
        <div id="dialog-buttons" class="dialog-actions"></div>
      </div>
    </div>

    <script type="module" src="/src/app.ts"></script>
    <img src="/src/static/images/bg.png" alt="default background preload" style="display: none" />
  </body>
</html>
